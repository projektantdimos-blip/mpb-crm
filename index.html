<!DOCTYPE html>
<html lang="ru">
<head>
<title>МПБ — Рабочие инструменты</title>
<meta name="description" content="Задачи, коммерческие предложения и реестр КП — Мир пожарной безопасности">
<meta name="theme-color" content="#1f5c99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="МПБ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --blue:#1f5c99;--blue-d:#164a7d;--blue-l:#e8f0f8;--orange:#ee9264;
  --ink:#1d2733;--muted:#66717e;--line:#d6dde5;--bg:#f3f6f9;
  --ok:#1e7b46;--ok-l:#e5f4ec;--bad:#c0392b;--bad-l:#fdeceb;--warn:#a86a00;--warn-l:#fbf1e0;
  --card:#ffffff;
}
html{font-size:15px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;min-height:100%;}
a{color:inherit;text-decoration:none}

.top{background:var(--blue);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.top .brand{display:flex;align-items:center;gap:12px}
.top .brand img{height:40px;width:auto;border-radius:6px;background:#fff;padding:2px}
.top h1{margin:0;font-size:1.25rem}
.top p{margin:2px 0 0;opacity:.9;font-size:.85rem}
.top .backlink{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
.top .backlink:hover{background:rgba(255,255,255,.12)}
.top .refresh{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}

.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:180px;padding:9px 12px;border:1px solid #b9c4d0;border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.viewtoggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.viewtoggle button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--muted)}
.viewtoggle button.active{background:var(--blue);color:#fff;font-weight:600}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;align-items:start}
.board-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.board-col h3{margin:0 0 10px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.board-col h3 .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.board-col h3 .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:.82rem}
.board-col .list{gap:8px}
.board-col .task-card{padding:11px 12px}
.board-col .empty2{color:var(--muted);font-size:.85rem;text-align:center;padding:16px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}

.summary-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.82rem;display:flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.primary:hover{background:var(--blue-d)}
button.primary:disabled{opacity:.6;cursor:wait}
button.ghost{background:var(--card);border:1px solid #b9c4d0;color:var(--ink);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.ghost:hover{border-color:var(--blue)}
button.danger{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.danger:hover{background:var(--bad-l)}

.list{display:flex;flex-direction:column;gap:10px}
.task-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.task-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(31,92,153,.10)}
.task-card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.task-card .cust{font-weight:700;font-size:1.02rem}
.task-card .worktype{color:var(--muted);font-size:.82rem;background:var(--blue-l);padding:2px 9px;border-radius:12px}
.task-card .addr{color:var(--muted);font-size:.88rem;margin-top:2px}
.task-card .meta{color:var(--muted);font-size:.8rem;margin-top:6px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.badge{border-radius:20px;padding:4px 11px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.badge.stage{background:var(--blue-l);color:var(--blue-d)}
.badge.person{color:#fff}
.badge.deadline{background:var(--ok-l);color:var(--ok)}
.badge.deadline.overdue{background:var(--bad-l);color:var(--bad)}
.badge.deadline.soon{background:var(--warn-l);color:var(--warn)}
.badge.closed{background:var(--muted);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card h2{margin:0 0 14px;font-size:1.05rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--muted)}
input[type=text],input[type=date],input[type=tel],textarea,select{
  width:100%;padding:9px 10px;border:1px solid #b9c4d0;border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3e8;border-color:var(--blue)}
textarea{resize:vertical;min-height:64px}

.stepper{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 16px;overflow-x:auto;padding-bottom:4px}
.step{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.step .circle{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.step.done .circle{background:var(--ok);color:#fff}
.step.current .circle{outline:3px solid var(--blue-l);}
.step .lbl2{font-size:.62rem;color:var(--muted);text-align:center;max-width:70px;line-height:1.15}
.step.current .lbl2{color:var(--ink);font-weight:600}

.resp-readout{display:flex;align-items:center;gap:8px;margin:-4px 0 16px}
.resp-readout .badge{color:#fff}
.closed-row{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-weight:600;font-size:.9rem}
.closed-row input{width:18px;height:18px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.loading{color:var(--muted);text-align:center;padding:60px 0}
.err{background:var(--bad-l);color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.notice{background:var(--ok-l);color:var(--ok);padding:9px 13px;border-radius:8px;font-weight:600;font-size:.88rem;margin-bottom:14px}

#topnav{background:var(--blue-d);}
#topnav .row{display:flex;gap:4px;padding:8px 16px;flex-wrap:wrap;}
#topnav .row.sub{background:rgba(0,0,0,.15);padding:6px 16px;}
#topnav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:8px;font:inherit;font-size:.88rem;cursor:pointer;}
#topnav button.active{background:#fff;color:var(--blue-d);font-weight:700;border-color:#fff;}

#kpreg-app{display:none;}
#kpreg-app .wrap2{max-width:1400px;margin:0 auto;padding:28px 16px 50px}
#kpreg-app .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#kpreg-app .summary-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#kpreg-app .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.82rem;color:var(--muted)}
#kpreg-app .chip b{color:var(--ink)}
#kpreg-app .tabs{display:flex;gap:6px;flex-wrap:wrap}
#kpreg-app .tab{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
#kpreg-app .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
#kpreg-app .viewtoggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
#kpreg-app .viewtoggle button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--muted)}
#kpreg-app .viewtoggle button.active{background:var(--blue);color:#fff;font-weight:600}
#kpreg-app .list{display:flex;flex-direction:column;gap:10px}
#kpreg-app .lead-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
#kpreg-app .lead-card.overdue{border-left:4px solid var(--bad)}
#kpreg-app .lead-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(31,92,153,.10)}
#kpreg-app .lead-card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
#kpreg-app .lead-card .name{font-weight:700;font-size:1.02rem}
#kpreg-app .lead-card .amount{font-weight:700;font-size:1.05rem;color:var(--blue-d)}
#kpreg-app .lead-card .meta{color:var(--muted);font-size:.85rem;margin-top:4px}
#kpreg-app .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
#kpreg-app .badge{border-radius:20px;padding:4px 11px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
#kpreg-app .badge.st-active{background:var(--blue-l);color:var(--blue-d)}
#kpreg-app .badge.st-won{background:var(--ok-l);color:var(--ok)}
#kpreg-app .badge.st-lost{background:var(--bad-l);color:var(--bad)}
#kpreg-app .badge.st-hold{background:var(--warn-l);color:var(--warn)}
#kpreg-app .badge.days-ok{background:#eef1f5;color:var(--muted)}
#kpreg-app .badge.days-bad{background:var(--bad-l);color:var(--bad)}
#kpreg-app .badge.funnel{background:#eef1f5;color:var(--muted)}
#kpreg-app .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
#kpreg-app .card h2{margin:0 0 14px;font-size:1.05rem}
#kpreg-app .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#kpreg-app .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){#kpreg-app .row2,#kpreg-app .row3{grid-template-columns:1fr}}
#kpreg-app .field{display:block;margin-bottom:14px}
#kpreg-app .lbl{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--muted)}
#kpreg-app input[type=text],#kpreg-app input[type=number],#kpreg-app input[type=date],#kpreg-app select,#kpreg-app textarea{
  width:100%;padding:9px 10px;border:1px solid #b9c4d0;border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
#kpreg-app input:focus,#kpreg-app select:focus{outline:2px solid #9cc3e8;border-color:var(--blue)}
#kpreg-app textarea{resize:vertical;min-height:64px}
#kpreg-app .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#kpreg-app button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
#kpreg-app button.primary:hover{background:var(--blue-d)}
#kpreg-app button.ghost{background:var(--card);border:1px solid #b9c4d0;color:var(--ink);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
#kpreg-app button.danger{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
#kpreg-app .backlink{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
#kpreg-app .gridwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:100%}
#kpreg-app table.kpgrid{border-collapse:collapse;font-size:.8rem;white-space:nowrap;width:100%}
#kpreg-app table.kpgrid th{background:var(--blue);color:#fff;padding:7px 8px;text-align:left;position:sticky;top:0;z-index:2;font-weight:600;font-size:.72rem}
#kpreg-app table.kpgrid td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--card)}
#kpreg-app table.kpgrid tr:hover td{background:rgba(31,92,153,.04)}
#kpreg-app table.kpgrid td.cust{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-weight:600;cursor:pointer;color:var(--blue-d)}
#kpreg-app table.kpgrid td.cust:hover{text-decoration:underline}
#kpreg-app table.kpgrid td.num{color:var(--muted);text-align:center}
#kpreg-app table.kpgrid tr.overdue td{background:var(--bad-l)}
#kpreg-app table.kpgrid tr.overdue:hover td{background:#fbdcda}
#kpreg-app table.kpgrid select.statusSel{padding:4px 6px;border-radius:6px;font:inherit;font-size:.78rem;border:1px solid var(--line)}
#kpreg-app table.kpgrid td.open{text-align:center}
#kpreg-app table.kpgrid td.open a{color:var(--blue);text-decoration:none;font-size:.85rem}
 
.kpc-scope .hidden{display:none!important}
.kpc-scope .top{background:var(--blue);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.kpc-scope .top h1{margin:0;font-size:1.35rem}
.kpc-scope .top p{margin:2px 0 0;opacity:.9;font-size:.92rem;max-width:720px}
.kpc-scope .top nav{display:flex;gap:6px}
.kpc-scope .tab{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.kpc-scope .tab.active{background:#fff;color:var(--blue);font-weight:600}
.kpc-scope #tab-memo{max-width:1200px;margin:18px auto;padding:0 16px}
.kpc-scope .layout{display:grid;grid-template-columns:minmax(360px,520px) 1fr;gap:18px;max-width:1300px;margin:18px auto;padding:0 16px;align-items:start}
@media(max-width:900px){.kpc-scope .layout{grid-template-columns:1fr}}
.kpc-scope .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.kpc-scope .card h2{margin:0 0 10px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.kpc-scope .card h3{margin:16px 0 8px;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpc-scope .step{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:.85rem}
.kpc-scope .sub{color:var(--muted);font-size:.88rem;margin:4px 0 10px}
.kpc-scope .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpc-scope .field{display:block;margin-bottom:12px}
.kpc-scope .field.small{margin:8px 0}
.kpc-scope .lbl{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.kpc-scope .field.small .lbl{font-weight:500}
.kpc-scope .hint{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.kpc-scope input[type=text], .kpc-scope input[type=date], .kpc-scope input:not([type]){width:100%;padding:9px 10px;border:1px solid #b9c4d0;border-radius:8px;font:inherit;background:#fff}
.kpc-scope input:focus{outline:2px solid #9cc3e8;border-color:var(--blue)}
.kpc-scope .err{color:var(--bad);font-size:.82rem;margin-top:3px;min-height:0}
.kpc-scope .err:empty{display:none}
.kpc-scope .svc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfd}
.kpc-scope .svc.on{border-color:var(--blue);background:#fff;box-shadow:0 0 0 1px var(--blue) inset}
.kpc-scope .svc-head{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer}
.kpc-scope .svc-head input{margin-top:3px;width:18px;height:18px;flex:none}
.kpc-scope .svc-title{font-weight:600}
.kpc-scope .svc-body{display:none;padding:0 12px 12px 40px}
.kpc-scope .svc.on .svc-body{display:block}
.kpc-scope .rule{color:var(--muted);font-size:.8rem;margin-top:8px;padding:6px 8px;background:var(--blue-l);border-radius:6px}
.kpc-scope .chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.kpc-scope .chk input{margin-top:3px;flex:none}
.kpc-scope .chk.inline{display:inline-flex;margin-right:16px}
.kpc-scope .radios{display:flex;gap:6px}
.kpc-scope .multi .chk{margin:4px 0}
.kpc-scope .list .listrow{display:grid;grid-template-columns:22px 1fr 70px auto 28px;gap:6px;align-items:center;margin-bottom:6px}
.kpc-scope .list .listrow .err{grid-column:2/-1;margin:0}
.kpc-scope .list .num{color:var(--muted);text-align:right}
.kpc-scope .unit{color:var(--muted)}
.kpc-scope button.icon{border:0;background:#eef1f5;border-radius:6px;cursor:pointer;height:28px;color:var(--muted)}
.kpc-scope button.link{border:0;background:none;color:var(--blue);cursor:pointer;font:inherit;padding:4px 0}
.kpc-scope .deadline{display:none;margin-top:8px}
.kpc-scope .deadline.on{display:block}
.kpc-scope .row-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpc-scope .row-inline input{width:64px;text-align:center}
.kpc-scope .warn-inline{color:var(--warn);font-size:.85rem;margin-top:6px}
.kpc-scope .warn-inline:empty{display:none}
.kpc-scope .right{align-self:stretch}
.kpc-scope .right .sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.kpc-scope .okbox{background:#e5f4ec;color:var(--ok);padding:10px 12px;border-radius:8px;font-weight:600}
.kpc-scope .badbox{background:#fdeceb;color:var(--bad);padding:10px 12px;border-radius:8px;font-weight:600}
.kpc-scope .summary ul{margin:8px 0 0;padding-left:20px;font-size:.88rem}
.kpc-scope .summary .warns{color:var(--warn);list-style:none;padding-left:0}
.kpc-scope .summary .more{list-style:none;color:var(--muted)}
.kpc-scope .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.kpc-scope button.primary{flex:1;min-width:140px;background:#9aa8b7;color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.kpc-scope button.primary.ready{background:var(--blue)}
.kpc-scope button.primary.ready:hover{background:var(--blue-d)}
.kpc-scope button.primary:disabled{opacity:.6;cursor:wait}
.kpc-scope button.ghost{background:#fff;border:1px solid #b9c4d0;border-radius:8px;padding:12px 14px;font:inherit;cursor:pointer}
.kpc-scope .paper{border:1px solid var(--line);border-radius:6px;padding:14px;background:#fff;font-size:.85rem}
.kpc-scope .paper .lh{background:var(--blue);color:#fff;padding:10px;border-radius:4px;text-align:center;font-size:.78rem;margin-bottom:10px}
.kpc-scope .paper table{width:100%;border-collapse:collapse}
.kpc-scope .paper .meta td{padding:2px 0}
.kpc-scope .paper .r{text-align:right}
.kpc-scope .paper .intro{text-align:center;margin:12px 0}
.kpc-scope .paper .srv th{background:var(--orange);color:#fff;font-weight:400;padding:6px;border:1px solid #000}
.kpc-scope .paper .srv td{border:1px solid #000;padding:5px 6px;vertical-align:middle}
.kpc-scope .paper .srv td.c{text-align:center;white-space:nowrap}
.kpc-scope .paper .nds{color:#808080}
.kpc-scope .paper .emptyrow{color:var(--muted);text-align:center;padding:14px}
.kpc-scope .paper .note{font-style:italic;text-align:justify;margin:8px 0}
.kpc-scope .paper .fixed{border-top:1px solid #000;padding-top:8px;color:var(--muted);font-size:.78rem}
.kpc-scope .miss{background:#fdeceb;color:var(--bad);border-radius:3px;padding:0 3px;font-style:normal}
.kpc-scope .rules li{margin:6px 0}
.kpc-scope .tablewrap{overflow-x:auto}
.kpc-scope table.memo{width:100%;border-collapse:collapse;font-size:.9rem}
.kpc-scope table.memo th{background:var(--blue);color:#fff;text-align:left;padding:8px}
.kpc-scope table.memo td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.kpc-scope table.memo .ex{min-width:300px}
.kpc-scope .memo .pr{color:var(--muted);margin-top:4px}
.kpc-scope .memo .src{color:var(--muted);font-size:.78rem;margin-top:2px}
.kpc-scope .muted{color:var(--muted)}
.kpc-scope .customrow{display:grid;grid-template-columns:22px 1fr 100px 28px;gap:6px;align-items:center;margin-bottom:6px}
.kpc-scope .customrow .err{grid-column:2/-1;margin:0}
.kpc-scope .field.disabled{opacity:.45}
.kpc-scope .paper .tot{font-weight:700}

</style>

var cache = { tasks: [] };
var listFilter = { person: "Все", q: "", view: "list" };

function taskCardHtml(t){
  var dstat = deadlineStatus(t.deadline);
  var pc = PERSON_COLOR[t.responsible] || '#888';
  return '<div class="task-card" data-row="'+t.row+'">'
    + '<div class="row1"><div class="cust">'+esc(t.customer||"(без названия)")+(t.closed?' <span class="badge closed">Закрыто</span>':'')+'</div><div class="worktype">'+esc(t.workType)+'</div></div>'
    + '<div class="addr">'+esc(t.address)+'</div>'
    + '<div class="meta">Договор '+esc(t.contractNo)+' · начало '+fmtDate(t.startDate)+' · срок по договору '+fmtDate(t.dueDate)+'</div>'
    + '<div class="badges">'
    +   '<span class="badge stage">'+(stageIndex(t.stage)+1)+'/'+STAGES.length+' · '+esc(t.stage)+'</span>'
    +   (t.responsible ? '<span class="badge person" style="background:'+pc+'">'+esc(t.responsible)+'</span>' : '')
    +   '<span class="badge deadline '+dstat+'">Дедлайн этапа: '+fmtDate(t.deadline)+'</span>'
    + '</div>'
    + '</div>';
}

function esc(s){
  if(s==null) s="";
  return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;");
}
function fmtDate(d){ if(!d) return "—"; var p=String(d).split("-"); return p.length===3 ? (p[2]+"."+p[1]+"."+p[0]) : d; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ var d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function deadlineStatus(iso){
  if(!iso) return "";
  var today = todayISO(), soon = addDays(today,2);
  if(iso < today) return "overdue";
  if(iso <= soon) return "soon";
  return "";
}
function stageIndex(name){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].name===name) return i; } return 0; }


/* ---------- связь с таблицей ----------
   Внутри Apps Script — google.script.run (как раньше).
   Как отдельный файл/сайт/PWA — POST на URL веб-приложения (адрес и ключ в ⚙). */
var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycby6jhByQ02pEOiEn1CYeN45o1lDE6d72UNU0Qn2B-09KqzEKxcQLiem5TDJHhkwUfs-/exec";
function apiCfg(){
  try { var c = JSON.parse(localStorage.getItem("mpb_api") || "{}"); return { url: c.url || DEFAULT_API_URL, key: c.key || "" }; }
  catch(e){ return { url: DEFAULT_API_URL, key: "" }; }
}
function callServer(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.google && google.script && google.script.run) {
    return new Promise(function(resolve, reject){
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(err){
        reject(err && err.message ? err.message : String(err));
      });
      runner[fn].apply(runner, args);
    });
  }
  var cfg = apiCfg();
  if (!cfg.key) { setTimeout(function(){ if (window.openApiSettings) openApiSettings(); }, 0); return Promise.reject("Не задан ключ доступа — откройте ⚙ Настройки"); }
  return fetch(cfg.url, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // без preflight
    body: JSON.stringify({ key: cfg.key, fn: fn, args: args })
  }).then(function(r){ return r.json(); }, function(){ throw "Нет связи с таблицей. Проверьте интернет и адрес в ⚙"; })
    .then(function(j){ if (!j || !j.ok) throw (j && j.error) || "Ошибка сервера"; return j.data; });
}

function tasksRouter(){
  var h = location.hash;
  if(h.indexOf("#/task/")===0){
    var row = +h.slice(7);
    renderDetailLoading(true);
    callServer("api_getTask", row).then(function(t){ renderDetail(t, false); }).catch(showError);
    return;
  }
  if(h==="#/new"){ renderDetail(null, true); return; }
  renderListLoading();
  callServer("api_listTasks").then(function(tasks){ cache.tasks = tasks; renderList(); }).catch(showError);
}
function showError(msg){
  document.getElementById("tasks-app").innerHTML =
    '<div class="wrap"><div class="err">Ошибка: ' + esc(msg) + '. Обновите страницу или попробуйте ещё раз.</div>' +
    '<button class="ghost" onclick="location.hash=\'#/\'; tasksRouter();">← К списку</button></div>';
}

function header(showBack){
  return '<header class="top">'
    + '<div class="brand"><img src="'+LOGO+'" alt="МПБ">'
    +   '<div><h1>CRM Монтаж — МПБ</h1><p>13 этапов: от подписания договора до сдачи работ</p></div>'
    + '</div>'
    + (showBack
        ? '<button class="backlink" onclick="location.hash=\'#/\'; tasksRouter();">← К списку задач</button>'
        : '<button class="refresh" onclick="tasksRouter()">⟳ Обновить</button>')
    + '</header>';
}

function renderListLoading(){
  document.getElementById("tasks-app").innerHTML = header(false) + '<div class="wrap"><div class="loading">Загружаю задачи из таблицы…</div></div>';
}
function renderDetailLoading(){
  document.getElementById("tasks-app").innerHTML = header(true) + '<div class="wrap"><div class="loading">Загружаю задачу…</div></div>';
}

function renderList(){
  var app = document.getElementById("tasks-app");
  var tasks = cache.tasks.filter(function(t){
    if(listFilter.person!=="Все" && t.responsible!==listFilter.person) return false;
    if(listFilter.q){
      var q = listFilter.q.toLowerCase();
      var hay = (t.customer+" "+t.address+" "+t.contractNo).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });

  var counts = {};
  ALL_PEOPLE.forEach(function(p){ counts[p]=0; });
  cache.tasks.forEach(function(t){ if(t.responsible) counts[t.responsible]=(counts[t.responsible]||0)+1; });
  var chips = ALL_PEOPLE.map(function(p){
    return '<span class="chip"><span class="dot" style="background:'+(PERSON_COLOR[p]||'#999')+'"></span>'+esc(p)+': '+(counts[p]||0)+' задач.</span>';
  }).join("");

  var tabs = ["Все"].concat(ALL_PEOPLE).map(function(p){
    return '<button class="tab '+(listFilter.person===p?"active":"")+'" data-person="'+esc(p)+'">'+esc(p)+'</button>';
  }).join("");

  var viewToggle = '<div class="viewtoggle">'
    + '<button data-view="list" class="'+(listFilter.view==="list"?"active":"")+'">📇 Список</button>'
    + '<button data-view="board" class="'+(listFilter.view==="board"?"active":"")+'">🧑‍🔧 По исполнителям</button>'
    + '</div>';

  var bodyHtml;
  if (listFilter.view === "board") {
    bodyHtml = boardHtml(tasks);
  } else {
    var cards = tasks.map(taskCardHtml).join("");
    if(!cards) cards = '<div class="empty">Ничего не найдено под текущий фильтр.</div>';
    bodyHtml = '<div class="list">'+cards+'</div>';
  }

  app.innerHTML = header(false)
    + '<div class="wrap">'
    +   '<div class="summary-row">'+chips+'</div>'
    +   '<div class="toolbar">'
    +     '<div class="tabs">'+(listFilter.view==="board"?"":tabs)+'</div>'
    +     '<input type="text" id="q" name="task-filter-q" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other" placeholder="Поиск по заказчику, адресу, номеру договора…" value="'+esc(listFilter.q)+'">'
    +     viewToggle
    +     '<button class="primary" id="newBtn">+ Новая задача</button>'
    +   '</div>'
    +   bodyHtml
    + '</div>';

  var cardEls = document.querySelectorAll(".task-card");
  for(var i=0;i<cardEls.length;i++){
    (function(el){ el.onclick = function(){ location.hash = "#/task/"+el.dataset.row; }; })(cardEls[i]);
  }
  var tabEls = document.querySelectorAll(".tab");
  for(var j=0;j<tabEls.length;j++){
    (function(el){ el.onclick = function(){ listFilter.person = el.dataset.person; renderList(); }; })(tabEls[j]);
  }
  document.getElementById("q").oninput = function(e){
    var pos = e.target.selectionStart;
    listFilter.q = e.target.value;
    renderList();
    var qi = document.getElementById("q");
    if(qi){ qi.focus(); try { qi.setSelectionRange(pos, pos); } catch(err){} }
  };
  document.getElementById("newBtn").onclick = function(){ location.hash = "#/new"; };
  var viewEls = document.querySelectorAll(".viewtoggle button");
  for(var k=0;k<viewEls.length;k++){
    (function(el){ el.onclick = function(){ listFilter.view = el.dataset.view; renderList(); }; })(viewEls[k]);
  }
}

function boardHtml(tasks){
  var groups = {};
  ALL_PEOPLE.forEach(function(p){ groups[p] = []; });
  var noOne = [];
  tasks.forEach(function(t){
    if (t.responsible && groups[t.responsible]) groups[t.responsible].push(t);
    else noOne.push(t);
  });
  var cols = ALL_PEOPLE.map(function(p){
    var list = groups[p];
    var body = list.length ? list.map(taskCardHtml).join("") : '<div class="empty2">Нет задач</div>';
    return '<div class="board-col">'
      + '<h3><span class="dot" style="background:'+(PERSON_COLOR[p]||'#888')+'"></span>'+esc(p)+'<span class="cnt">'+list.length+'</span></h3>'
      + '<div class="list">'+body+'</div>'
      + '</div>';
  }).join("");
  if (noOne.length){
    cols += '<div class="board-col"><h3><span class="dot" style="background:#999"></span>Без ответственного<span class="cnt">'+noOne.length+'</span></h3>'
      + '<div class="list">'+noOne.map(taskCardHtml).join("")+'</div></div>';
  }
  return '<div class="board">'+cols+'</div>';
}

function renderDetail(task, isNew){
  var app = document.getElementById("tasks-app");
  var t = task || {row:null, customer:"", address:"", contractNo:"", workType:"", startDate:todayISO(), dueDate:"", stage:STAGES[0].name, deadline:"", comment:"", siteContact:"", siteContactPhone:"", manager:"", closed:false};

  var steps = STAGES.map(function(s,i){

    +   '<div class="row2">'
    +     '<label class="field"><span class="lbl">Заказчик</span><input type="text" id="f_customer" value="'+esc(t.customer)+'"></label>'
    +     '<label class="field"><span class="lbl">Вид работы</span><input type="text" id="f_workType" value="'+esc(t.workType)+'"></label>'
    +   '</div>'
    +   '<label class="field"><span class="lbl">Адрес объекта</span><input type="text" id="f_address" value="'+esc(t.address)+'"></label>'
    +   '<div class="row2">'
    +     '<label class="field"><span class="lbl">Номер договора</span><input type="text" id="f_contractNo" value="'+esc(t.contractNo)+'"></label>'
    +     '<label class="field"><span class="lbl">Ответственный за заказчика</span><input type="text" id="f_manager" value="'+esc(t.manager)+'"></label>'
    +   '</div>'
    +   '<div class="row2">'
    +     '<label class="field"><span class="lbl">Дата начала по договору</span><input type="date" id="f_startDate" value="'+esc(t.startDate)+'"></label>'
    +     '<label class="field"><span class="lbl">Крайний срок по договору</span><input type="date" id="f_dueDate" value="'+esc(t.dueDate)+'"></label>'
    +   '</div>'
    +   '<label class="field"><span class="lbl">Дедлайн по текущему этапу</span><input type="date" id="f_deadline" value="'+esc(t.deadline)+'"></label>'
    +   '<div class="row2">'
    +     '<label class="field"><span class="lbl">Ответственное лицо на объекте</span><input type="text" id="f_siteContact" value="'+esc(t.siteContact)+'"></label>'
    +     '<label class="field"><span class="lbl">Телефон ответственного на объекте</span><input type="tel" id="f_siteContactPhone" value="'+esc(t.siteContactPhone)+'"></label>'
    +   '</div>'
    +   '<label class="field"><span class="lbl">Комментарий</span><textarea id="f_comment">'+esc(t.comment)+'</textarea></label>'
    +   '<label class="closed-row"><input type="checkbox" id="f_closed" '+(t.closed?"checked":"")+'> Закрыто (при этапе «Работа сдана» уйдёт в архив)</label>'
    +   '<div id="notice"></div>'
    +   '<div class="actions">'
    +     '<button class="primary" id="saveBtn">'+(isNew?"Создать задачу":"Сохранить изменения")+'</button>'
    +     (isNew ? "" : '<button class="danger" id="delBtn">Удалить задачу</button>')
    +     '<button class="ghost" type="button" onclick="location.hash=\'#/\'; tasksRouter();">Отмена</button>'
    +   '</div>'
    + '</div></div>';

  document.getElementById("f_stage").onchange = function(e){
    var who = STAGES[stageIndex(e.target.value)].who;
    var b = document.getElementById("respBadge");
    b.textContent = who; b.style.background = PERSON_COLOR[who] || '#888';
  };

  function setBusy(busy, label){
    var b = document.getElementById("saveBtn");
    b.disabled = busy; if(label) b.textContent = label;
  }

  document.getElementById("saveBtn").onclick = function(){
    var data = {
      customer: document.getElementById("f_customer").value.trim(),
      workType: document.getElementById("f_workType").value.trim(),
      address: document.getElementById("f_address").value.trim(),
      contractNo: document.getElementById("f_contractNo").value.trim(),
      manager: document.getElementById("f_manager").value.trim(),
      startDate: document.getElementById("f_startDate").value,
      dueDate: document.getElementById("f_dueDate").value,
      stage: document.getElementById("f_stage").value,
      deadline: document.getElementById("f_deadline").value,
      siteContact: document.getElementById("f_siteContact").value.trim(),
      siteContactPhone: document.getElementById("f_siteContactPhone").value.trim(),
      comment: document.getElementById("f_comment").value.trim(),
      closed: document.getElementById("f_closed").checked
    };
    setBusy(true, "Сохраняю…");
    var p = isNew ? callServer("api_createTask", data) : callServer("api_saveTask", t.row, data);
    p.then(function(){ location.hash = "#/"; }).catch(function(msg){ setBusy(false, isNew?"Создать задачу":"Сохранить изменения"); showError(msg); });
  };

  if(!isNew){
    document.getElementById("delBtn").onclick = function(){
      if(!confirm('Удалить задачу «'+t.customer+'»? Это действие необратимо.')) return;
      callServer("api_deleteTask", t.row).then(function(){ location.hash = "#/"; }).catch(showError);
    };

function sectionForHash(h){
  if (h.indexOf("#/kpreg") === 0) return "kpreg";
  if (h.indexOf("#/kpc") === 0) return "kpc";
  if (h.indexOf("#/chat") === 0) return "chat";
  if (h.indexOf("#/to") === 0) return "to";
  return "tasks";
}
function renderTopNav(){
  var cur = sectionForHash(location.hash);
  var primaryActive = (cur === "tasks") ? "tasks" : (cur === "chat") ? "chat" : (cur === "to") ? "to" : "commerce";
  var row1 = '<div class="row">'
    + '<button data-goto="#/" class="' + (primaryActive==="tasks"?"active":"") + '">🧯 Задачи</button>'
    + '<button data-goto="#/kpreg/" class="' + (primaryActive==="commerce"?"active":"") + '">💼 Коммерция</button>'
    + '<button data-goto="#/chat" class="' + (primaryActive==="chat"?"active":"") + '">💬 Общение</button>'
    + '<button data-goto="#/to" class="' + (primaryActive==="to"?"active":"") + '">🛠 ТО МПБ</button>'
    + '</div>';
  var row2 = "";
  if (primaryActive === "commerce") {
    row2 = '<div class="row sub">'
      + '<button data-goto="#/kpreg/" class="' + (cur==="kpreg"?"active":"") + '">📋 Реестр КП</button>'
      + '<button data-goto="#/kpc" class="' + (cur==="kpc"?"active":"") + '">🧾 Конструктор КП</button>'
      + '</div>';
  }
  document.getElementById("topnav").innerHTML = row1 + row2;
  document.querySelectorAll("#topnav button").forEach(function(b){
    b.onclick = function(){ location.hash = b.dataset.goto; };
  });
}
function globalRouter(){
  renderTopNav();
  var sec = sectionForHash(location.hash);
  document.getElementById("tasks-app").style.display = (sec === "tasks") ? "block" : "none";
  document.getElementById("kpreg-app").style.display = (sec === "kpreg") ? "block" : "none";
  document.getElementById("kpc-app").style.display = (sec === "kpc") ? "block" : "none";
  document.getElementById("chat-app").style.display = (sec === "chat") ? "block" : "none";
  document.getElementById("to-app").style.display = (sec === "to") ? "block" : "none";
  if (sec === "to") { var tf = document.getElementById("to-frame"); if (!tf.getAttribute("src")) tf.setAttribute("src", "to-mpb.html"); }
  if (sec === "chat" && window.__subRouters && window.__subRouters.chat) window.__subRouters.chat();
  if (sec === "kpreg") { if (window.__subRouters && window.__subRouters.kpreg) window.__subRouters.kpreg(); }
  else if (sec === "tasks") { tasksRouter(); }
}
window.addEventListener("hashchange", globalRouter);
globalRouter();
</script>
<script>
(function(){

var STATUSES = [
  ["Новое обращение","Нет"], ["КП отправлено","Нет"], ["Переговоры","Нет"],
  ["Согласование условий","Нет"], ["Отложено","Да"], ["Выиграно","Да"], ["Отказ","Да"]
];
var STATUS_ARCHIVAL = {};
STATUSES.forEach(function(s){ STATUS_ARCHIVAL[s[0]] = s[1] === "Да"; });
var STATUS_NAMES = STATUSES.map(function(s){ return s[0]; });
var FUNNEL_SOURCES = ["Сайт","Сарафан","Алексей","Дмитрий"];
var OVERDUE_DAYS = 5;

function esc(s){ if(s==null)s=""; return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;"); }
function money(n){ return Math.round(n).toLocaleString("ru-RU")+" ₽"; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(iso1, iso2){ return Math.floor((new Date(iso2) - new Date(iso1)) / 86400000); }

var cache = { leads: [] };

function computeLead(l){
  var base = l.lastContact || l.date;
  var days = base ? daysBetween(base, todayISO()) : 0;
  var archived = !!STATUS_ARCHIVAL[l.status];
  var overdue = !archived && days >= OVERDUE_DAYS;
  return { days: days, archived: archived, overdue: overdue };
}
function statusClass(status){
  if (status === "Выиграно") return "st-won";
  if (status === "Отказ") return "st-lost";
  if (status === "Отложено") return "st-hold";
  return "st-active";
}

function router(){
  var h = location.hash;
  if (h.indexOf("#/kpreg/lead/") === 0) {
    var row = +h.slice(13);
    renderDetailLoading(true);
    var found = cache.leads.find(function(x){ return x.row === row; });
    if (found) { renderDetail(found, false); return; }
    
    callServer("api_kpregList").then(function(leads){
      cache.leads = leads;
      var l = leads.find(function(x){ return x.row === row; });
      if (l) renderDetail(l, false); else { location.hash = "#/kpreg/"; }
    }).catch(showKpregError);
    return;
  }
  if (h === "#/kpreg/new") return renderDetail(null, true);
  renderListLoading();
  callServer("api_kpregList").then(function(leads){ cache.leads = leads; renderList(); }).catch(showKpregError);
}
window.__subRouters = window.__subRouters || {};
window.__subRouters.kpreg = router;

function showKpregError(msg){
  document.getElementById("kpreg-app").innerHTML = header(false)
    + '<div class="wrap2"><div class="err">Ошибка: ' + esc(msg) + '. Обновите страницу или попробуйте ещё раз.</div>'
    + '<button class="ghost" onclick="location.hash=\'#/kpreg/\'; window.__subRouters.kpreg();">← К реестру</button></div>';
}

function header(showBack){
  return '<header class="top" style="position:static">'
    + '<div class="brand"><div><h1>Реестр КП МПБ</h1><p>Воронка предложений · приоритет обзвона по давности контакта</p></div></div>'
    + (showBack ? '<button class="backlink" onclick="location.hash=\'#/kpreg/\'; window.__subRouters.kpreg();">← К реестру</button>' : '<button class="refresh" onclick="window.__subRouters.kpreg()">⟳ Обновить</button>')
    + '</header>';
}

function renderListLoading(){
  document.getElementById("kpreg-app").innerHTML = header(false) + '<div class="wrap2"><div class="loading">Загружаю реестр из таблицы…</div></div>';
}
function renderDetailLoading(){
  document.getElementById("kpreg-app").innerHTML = header(true) + '<div class="wrap2"><div class="loading">Загружаю заявку…</div></div>';
}

var listFilter = { scope: "active", funnel: "Все", view: "table" };

function renderList(){
  var app = document.getElementById("kpreg-app");
  var withCalc = cache.leads.map(function(l){ return { l:l, c:computeLead(l) }; });

  var activeAll = withCalc.filter(function(x){ return !x.c.archived; });
  var archivedAll = withCalc.filter(function(x){ return x.c.archived; });
  var overdueCount = activeAll.filter(function(x){ return x.c.overdue; }).length;
  var activeSum = activeAll.reduce(function(s,x){ return s + (+x.l.amount||0); }, 0);

  var pool = listFilter.scope === "archive" ? archivedAll : activeAll;
  if (listFilter.scope === "active") pool.sort(function(a,b){ return b.c.days - a.c.days; });
  var funnels = ["Все"].concat(FUNNEL_SOURCES);
  var items = pool.filter(function(x){ return listFilter.funnel==="Все" || x.l.funnel===listFilter.funnel; });

  var scopeTabs = '<button class="tab ' + (listFilter.scope==="active"?"active":"") + '" data-scope="active">Активные (' + activeAll.length + ')</button>'
    + '<button class="tab ' + (listFilter.scope==="archive"?"active":"") + '" data-scope="archive">Архив (' + archivedAll.length + ')</button>';
  var funnelTabs = funnels.map(function(f){
    return '<button class="tab ' + (listFilter.funnel===f?"active":"") + '" data-funnel="' + esc(f) + '">' + esc(f) + '</button>';
  }).join(" ");

  var viewToggle = '<div class="viewtoggle">'
    + '<button data-view="table" class="' + (listFilter.view==="table"?"active":"") + '">📊 Таблица</button>'
    + '<button data-view="cards" class="' + (listFilter.view==="cards"?"active":"") + '">📇 Карточки</button>'
    + '</div>';

  var bodyHtml = listFilter.view === "table" ? kpTableHtml(items) : kpCardsHtml(items);

  app.innerHTML = header(false)
    + '<div class="wrap2">'
    + '<div class="summary-row">'
    + '<span class="chip">Активных заявок: <b>' + activeAll.length + '</b></span>'
    + '<span class="chip">Просрочен контакт (' + OVERDUE_DAYS + '+ дн.): <b>' + overdueCount + '</b></span>'
    + '<span class="chip">Сумма КП в работе: <b>' + money(activeSum) + '</b></span>'
    + '</div>'
    + '<div class="toolbar"><div class="tabs">' + scopeTabs + '</div>' + viewToggle + '</div>'
    + '<div class="toolbar"><div class="tabs">' + funnelTabs + '</div><button class="primary" id="kpNewBtn">+ Новая заявка</button></div>'
    + bodyHtml
    + '</div>';

  document.querySelectorAll("#kpreg-app .tab[data-scope]").forEach(function(el){
    el.onclick = function(){ listFilter.scope = el.dataset.scope; renderList(); };
  });
  document.querySelectorAll("#kpreg-app .tab[data-funnel]").forEach(function(el){
    el.onclick = function(){ listFilter.funnel = el.dataset.funnel; renderList(); };
  });
  document.querySelectorAll("#kpreg-app .viewtoggle button").forEach(function(el){
    el.onclick = function(){ listFilter.view = el.dataset.view; renderList(); };
  });
  document.getElementById("kpNewBtn").onclick = function(){ location.hash = "#/kpreg/new"; };
  wireListInteractions();
}

function kpCardsHtml(items){
  if (!items.length) return '<div style="color:var(--muted);text-align:center;padding:40px 0">Нет заявок под текущий фильтр</div>';
  var cards = items.map(function(x){
    var l=x.l, c=x.c;
    return '<div class="lead-card' + (c.overdue?' overdue':'') + '" data-row="' + l.row + '">'
      + '<div class="row1"><div class="name">№' + (l.row - 1) + ' · ' + esc(l.customer) + '</div><div class="amount">' + money(l.amount) + '</div></div>'
      + '<div class="meta">' + esc(l.object) + '</div>'
      + '<div class="badges">'
      + '<span class="badge ' + statusClass(l.status) + '">' + esc(l.status) + '</span>'
      + '<span class="badge funnel">' + esc(l.funnel) + '</span>'
      + '<span class="badge ' + (c.overdue?'days-bad':'days-ok') + '">Без контакта: ' + c.days + ' дн.</span>'
      + '</div></div>';
  }).join("");
  return '<div class="list">' + cards + '</div>';
}

function kpTableHtml(items){
  var head = '<tr><th>№</th><th>Заказчик</th><th>Объект</th><th>Воронка</th><th>Сумма КП</th><th>Статус</th><th>Дн. без контакта</th><th>Кто выставил</th><th></th></tr>';
  var rows = items.map(function(x){
    var l=x.l, c=x.c;
    return '<tr class="' + (c.overdue?'overdue':'') + '" data-row-id="' + l.row + '">'
      + '<td class="num">' + (l.row - 1) + '</td>'
      + '<td class="cust" data-row="' + l.row + '">' + esc(l.customer) + '</td>'
      + '<td>' + esc(l.object) + '</td>'
      + '<td>' + esc(l.funnel) + '</td>'
      + '<td class="num">' + money(l.amount) + '</td>'
      + '<td><select class="statusSel" data-row="' + l.row + '">' + STATUS_NAMES.map(function(s){ return '<option value="'+esc(s)+'" '+(s===l.status?'selected':'')+'>'+esc(s)+'</option>'; }).join("") + '</select></td>'
      + '<td class="num">' + c.days + '</td>'
      + '<td>' + esc(l.owner) + '</td>'
      + '<td class="open"><a href="javascript:void(0)" class="editOpen" data-row="' + l.row + '">✏️</a></td>'
      + '</tr>';
  }).join("") || '';
  var empty = items.length ? '' : '<div style="color:var(--muted);text-align:center;padding:30px 0">Нет заявок под текущий фильтр</div>';
  return '<div class="gridwrap"><table class="kpgrid">' + head + rows + '</table></div>' + empty;
}

function wireListInteractions(){
  document.querySelectorAll("#kpreg-app .lead-card").forEach(function(el){
    el.onclick = function(){ location.hash = "#/kpreg/lead/" + el.dataset.row; };
  });
  document.querySelectorAll("#kpreg-app td.cust").forEach(function(el){
    el.onclick = function(){ location.hash = "#/kpreg/lead/" + el.dataset.row; };
  });
  document.querySelectorAll("#kpreg-app .editOpen").forEach(function(el){
    el.onclick = function(){ location.hash = "#/kpreg/lead/" + el.dataset.row; };
  });
  document.querySelectorAll("#kpreg-app .statusSel").forEach(function(el){
    el.onchange = function(){
      var row = +el.dataset.row;
      var l = cache.leads.find(function(x){ return x.row === row; });
      if (!l) return;
      var prevStatus = l.status;
      l.status = el.value;
      renderList();
      callServer("api_kpregSave", row, l).catch(function(msg){ l.status = prevStatus; renderList(); showKpregError(msg); });
    };
  });
}

function renderDetail(lead, isNew){
  var app = document.getElementById("kpreg-app");
  var l = lead || { row:null, date:todayISO(), customer:"", contact:"", phoneEmail:"", funnel:FUNNEL_SOURCES[0],
    object:"", essence:"", amount:0, status:STATUS_NAMES[0], lastContact:"", owner:"", comment:"" };

  app.innerHTML = header(true)
    + '<div class="wrap2"><div class="card">'
    + '<h2>' + (isNew ? "Новая заявка" : ("№" + (l.row - 1) + " — " + esc(l.customer))) + '</h2>'
    + '<div id="kp_statusRow" style="margin-bottom:14px"></div>'
    + '<div class="row3">'
    + '<label class="field"><span class="lbl">Дата заявки</span><input type="date" id="k_date" value="' + esc(l.date) + '"></label>'
    + '<label class="field"><span class="lbl">Заказчик</span><input type="text" id="k_customer" value="' + esc(l.customer) + '"></label>'
    + '<label class="field"><span class="lbl">Воронка</span><select id="k_funnel">' + FUNNEL_SOURCES.map(function(f){ return '<option value="'+esc(f)+'" '+(f===l.funnel?'selected':'')+'>'+esc(f)+'</option>'; }).join("") + '</select></label>'
    + '</div>'
    + '<div class="row2">'
    + '<label class="field"><span class="lbl">Контактное лицо</span><input type="text" id="k_contact" value="' + esc(l.contact) + '"></label>'
    + '<label class="field"><span class="lbl">Телефон / Email</span><input type="text" id="k_phoneEmail" value="' + esc(l.phoneEmail) + '"></label>'
    + '</div>'
    + '<label class="field"><span class="lbl">Объект / адрес</span><input type="text" id="k_object" value="' + esc(l.object) + '"></label>'
    + '<label class="field"><span class="lbl">Суть предложения</span><textarea id="k_essence" rows="2">' + esc(l.essence) + '</textarea></label>'
    + '<div class="row3">'
    + '<label class="field"><span class="lbl">Сумма КП, ₽</span><input type="number" id="k_amount" value="' + l.amount + '"></label>'
    + '<label class="field"><span class="lbl">Статус</span><select id="k_status">' + STATUS_NAMES.map(function(s){ return '<option value="'+esc(s)+'" '+(s===l.status?'selected':'')+'>'+esc(s)+'</option>'; }).join("") + '</select></label>'
    + '<label class="field"><span class="lbl">Кто выставил КП</span><input type="text" id="k_owner" value="' + esc(l.owner) + '"></label>'
    + '</div>'
    + '<label class="field"><span class="lbl">Дата последнего контакта</span><input type="date" id="k_lastContact" value="' + esc(l.lastContact) + '" style="max-width:220px"></label>'
    + '<label class="field"><span class="lbl">Комментарий</span><textarea id="k_comment" rows="2">' + esc(l.comment) + '</textarea></label>'
    + '<div id="kp_notice"></div>'
    + '<div class="actions">'
    + '<button class="primary" id="kpSaveBtn">' + (isNew ? "Создать заявку" : "Сохранить изменения") + '</button>'
    + (isNew ? "" : '<button class="ghost" id="kpTouchBtn">Отметить контакт сегодня</button>')
    + (isNew ? "" : '<button class="danger" id="kpDelBtn">Удалить заявку</button>')
    + '<button class="ghost" type="button" onclick="location.hash=\'#/kpreg/\'; window.__subRouters.kpreg();">Отмена</button>'
    + '</div>'
    + '</div></div>';

  function readForm(){
    return {
      date: document.getElementById("k_date").value,
      customer: document.getElementById("k_customer").value.trim(),
      funnel: document.getElementById("k_funnel").value,
      contact: document.getElementById("k_contact").value.trim(),
      phoneEmail: document.getElementById("k_phoneEmail").value.trim(),
      object: document.getElementById("k_object").value.trim(),
      essence: document.getElementById("k_essence").value.trim(),
      amount: +document.getElementById("k_amount").value || 0,
      status: document.getElementById("k_status").value,
      owner: document.getElementById("k_owner").value.trim(),
      lastContact: document.getElementById("k_lastContact").value,
      comment: document.getElementById("k_comment").value.trim()
    };
  }
  function refreshStatus(){
    var data = readForm();
    var tmp = Object.assign({}, l, data);
    var c = computeLead(tmp);
    document.getElementById("kp_statusRow").innerHTML =
      '<span class="badge ' + statusClass(tmp.status) + '">' + esc(tmp.status) + '</span> '
      + '<span class="badge ' + (c.overdue?'days-bad':'days-ok') + '">Без контакта: ' + c.days + ' дн.</span> '
      + (c.archived ? '<span style="color:var(--muted);font-size:.85rem">Архивный статус — уйдёт в «Архив», скроется из активных.</span>' : '');
  }
  ["k_date","k_status","k_lastContact"].forEach(function(id){
    document.getElementById(id).addEventListener("input", refreshStatus);
    document.getElementById(id).addEventListener("change", refreshStatus);
  });
  refreshStatus();

  function setBusy(busy, label){
    var b = document.getElementById("kpSaveBtn");
    b.disabled = busy; if (label) b.textContent = label;
  }

  document.getElementById("kpSaveBtn").onclick = function(){
    var data = readForm();
    setBusy(true, "Сохраняю…");
    var p = isNew ? callServer("api_kpregCreate", data) : callServer("api_kpregSave", l.row, data);
    p.then(function(){ location.hash = "#/kpreg/"; })
     .catch(function(msg){ setBusy(false, isNew?"Создать заявку":"Сохранить изменения"); showKpregError(msg); });
  };
  if (!isNew) {
    document.getElementById("kpTouchBtn").onclick = function(){
      document.getElementById("k_lastContact").value = todayISO();
      refreshStatus();
    };
    document.getElementById("kpDelBtn").onclick = function(){
      if (!confirm('Удалить заявку «' + l.customer + '»? Это действие необратимо.')) return;
      callServer("api_kpregDelete", l.row).then(function(){ location.hash = "#/kpreg/"; }).catch(showKpregError);
    };
  }
}
})();
</script>

      const t = fixQuotes(cleanText(it.text)), p = parseIntStrict(it.price);

      else {

        if (count(t, '«') !== count(t, '»')) err('custom.' + i + '.text', n + 'кавычки не парные.');

      else if (p === null || p < 1) err('custom.' + i + '.price', n + 'стоимость — целое число рублей.');

function valuesFor(svc, st, lenient) {

function pdfLoadImage(b64) {
  return new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im); im.onerror = () => fail(new Error('Не удалось загрузить изображение бланка'));
    im.src = 'data:image/jpeg;base64,' + b64;
  });
}
// Перенос по словам; неразрывные пробелы не разрываются, слишком длинное слово режется по символам.
function pdfWrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    let cur = '';
    par.split(' ').forEach(word => {
      const t = cur ? cur + ' ' + word : word;
      if (!cur || ctx.measureText(t).width <= maxW) { cur = t; return; }
      out.push(cur); cur = word;
    });
    while (ctx.measureText(cur).width > maxW && cur.length > 1) {
      let n = cur.length - 1;
      while (n > 1 && ctx.measureText(cur.slice(0, n)).width > maxW) n--;
      out.push(cur.slice(0, n)); cur = cur.slice(n);
    }
    out.push(cur);
  });
  return out;
}
// Рисует страницы КП; возвращает массив canvas.
async function renderKpPages(model) {
  const banner = await pdfLoadImage(KP_BANNER_B64), footer = await pdfLoadImage(KP_FOOTER_B64);
  const F = (size, style) => (style ? style + ' ' : '') + size + 'px ' + PDF.FONT;
  const pages = [];

  const newPage = () => {
    cv = document.createElement('canvas');
    cv.width = Math.round(PDF.W * PDF.S); cv.height = Math.round(PDF.H * PDF.S);
    ctx = cv.getContext('2d');
    ctx.scale(PDF.S, PDF.S);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PDF.W + 1, PDF.H + 1);
    ctx.drawImage(banner, 0, 0, PDF.W, PDF.BANNER_H);
    ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.5; ctx.textBaseline = 'alphabetic';
    pages.push(cv); y = PDF.TOP;
  };
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  const base = (top, pitch) => top + pitch * 0.78;

  newPage();
  // шапка: № / дата / объект
  const MX0 = 28.85, MX1 = 568.4, MDIV = 298.6, MPAD = 5.65, MP = 17.1;
  ctx.font = F(14);
  const objLines = pdfWrap(ctx, model.object, MX1 - MDIV - 2 * MPAD);
  const row2H = Math.max(MP, objLines.length * MP) + 0.5;
  ctx.font = F(14, 'bold'); ctx.textAlign = 'left';
  ctx.fillText('Предложение № ' + model.num, 34.3, base(y, MP));
  ctx.fillText('Наименование объекта:', 34.3, base(y + MP + 0.5, MP));
  ctx.font = F(14); ctx.textAlign = 'right';
  ctx.fillText('От ' + model.date, 563, base(y, MP));
  objLines.forEach((t, i) => ctx.fillText(t, 563, base(y + MP + 0.5 + i * MP, MP)));
  line(MX0, y + MP + 0.25, MX1, y + MP + 0.25);
  line(MDIV, y, MDIV, y + MP + row2H);
  y += MP + row2H;
  y += 52.9; // две пустые строки шаблона

  // вводная фраза и адрес
  ctx.textAlign = 'center'; ctx.font = F(14);
  const IW = 539.4, ICX = 298.6, IP = 18.43;
  [model.intro, model.address].filter(Boolean).forEach(t => {
    pdfWrap(ctx, t, IW).forEach(l => { ctx.fillText(l, ICX, base(y, IP)); y += IP; });
  });
  y += 11;

  // таблица услуг
  const TX0 = 36.45, TX1 = 440.7, TX2 = 568.1, CP = 5.65, HH = 28.35, LP = 14.65, PP = 16.85;
  const header = () => {
    ctx.fillStyle = '#EE9264'; ctx.fillRect(TX0, y, TX2 - TX0, HH);
    ctx.fillStyle = '#fff'; ctx.font = F(12); ctx.textAlign = 'center';
    ctx.fillText('Наименование', (TX0 + TX1) / 2, base(y + (HH - LP) / 2, LP));
    ctx.fillText('Стоимость', (TX1 + TX2) / 2, base(y + (HH - LP) / 2, LP));
    ctx.fillStyle = '#000';
    ctx.strokeRect(TX0, y, TX1 - TX0, HH); ctx.strokeRect(TX1, y, TX2 - TX1, HH);
    y += HH;
  };
  header();
  const rows = model.rows.map(r => ({ left: r.lines, right: r.priceLines, grey: false, bold: false }));
  rows.push({ left: [model.totalLabel], right: model.total ? [model.total] : [], grey: true, bold: true });
  rows.forEach(r => {
    ctx.font = F(12);
    const left = [];
    r.left.forEach(t => pdfWrap(ctx, t, TX1 - TX0 - 2 * CP - 2).forEach(l => left.push(l)));
    const right = r.right.length ? r.right : [''];
    const lh = left.length * LP, rh = right.length * PP;
    const h = Math.max(HH, lh, rh);
    if (y + h > PDF.BOTTOM) { newPage(); header(); }
    ctx.strokeRect(TX0, y, TX1 - TX0, h); ctx.strokeRect(TX1, y, TX2 - TX1, h);
    ctx.textAlign = 'left'; ctx.fillStyle = r.grey ? '#808080' : '#000'; ctx.font = F(12);
    left.forEach((t, i) => ctx.fillText(t, TX0 + CP, base(y + (h - lh) / 2 + i * LP, LP)));
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.font = F(12, r.bold ? 'bold' : '');
    right.forEach((t, i) => ctx.fillText(t, (TX1 + TX2) / 2, base(y + (h - rh) / 2 + i * PP, PP)));
    y += h;
  });

  // примечание: курсив, по ширине
  ctx.font = F(12, 'italic'); ctx.fillStyle = '#000'; ctx.textAlign = 'left';
  const NX = 35.45, NW = 568.3 - 35.45, NP = 15.8;
  const nl = pdfWrap(ctx, model.note.join(' '), NW);
  if (y + nl.length * NP > PDF.BOTTOM) { newPage(); ctx.font = F(12, 'italic'); }
  nl.forEach((l, i) => {
    const words = l.split(' ');
    const by = base(y, NP);
    if (i === nl.length - 1 || words.length < 2) { ctx.fillText(l, NX, by); }
    else {
      const gap = (NW - words.reduce((s, w) => s + ctx.measureText(w).width, 0)) / (words.length - 1);
      let x = NX;
      words.forEach(w => { ctx.fillText(w, x, by); x += ctx.measureText(w).width + gap; });
    }
    y += NP;
  });

  // нижний блок: лицензия, QR, подпись и печать
  if (y + PDF.FOOTER_H > PDF.H - 6.8) newPage();
  ctx.drawImage(footer, 0, y - 0.4, PDF.W, PDF.FOOTER_H);
  return pages;
}
function pdfFromJpegs(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];

    offs[n] = len;
    put(n + ' 0 obj\n' + body + (stream ? '\nstream\n' : '\n'));
    if (stream) { put(stream); put('\nendstream\n'); }
    put('endobj\n');
  };

  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + kids + '] /Count ' + pages.length + ' >>');
  pages.forEach((p, i) => {
    const pg = 3 + 3 * i, ct = pg + 1, im = pg + 2;
    const content = enc.encode('q ' + PDF.W + ' 0 0 ' + PDF.H + ' 0 0 cm /Im0 Do Q');
    obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PDF.W + ' ' + PDF.H + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
    obj(ct, '<< /Length ' + content.length + ' >>', content);
    obj(im, '<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.bytes.length + ' >>', p.bytes);
  });
  const n = 3 + 3 * pages.length, xref = len;
  let x = 'xref\n0 ' + n + '\n0000000000 65535 f \n';
  for (let i = 1; i < n; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';

}

    const bytes = new Uint8Array(bin.length);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  });
  kids.flat().forEach(c => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}

function html(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function markHtml(s) { return html(s).split(MARK).join('<span class="miss">не заполнено</span>'); }

let summaryEl, previewEl, dlBtn, pdfBtn;
function refresh() {
  const res = validate(state);
  
  if (!state.deadline.dirty && state.deadline.on !== hasProject(state)) { state.deadline.on = hasProject(state); syncDeadlineUi(); }
  
  Object.keys(errEls).forEach(k => { errEls[k].textContent = ''; });
  res.errors.forEach(e => {
    if (errEls[e.key] && (showAll || touched.has(e.key)) && !errEls[e.key].textContent) errEls[e.key].textContent = e.msg;
  });
  document.querySelectorAll('[data-warn]').forEach(el => {
    const w = res.warnings.find(x => x.key === el.dataset.warn);
    el.textContent = w ? '⚠ ' + w.msg : '';
  });
  
  summaryEl.textContent = '';
  if (res.ok) summaryEl.append(h('div', { class: 'okbox' }, '✔ Всё заполнено правильно. Можно скачивать.'));
  else {
    summaryEl.append(h('div', { class: 'badbox' }, 'Нужно заполнить или исправить: ' + res.errors.length),
      h('ul', null, res.errors.slice(0, 6).map(e => h('li', null, e.msg)),
        res.errors.length > 6 ? h('li', { class: 'more' }, 'и ещё ' + (res.errors.length - 6) + '…') : null));
  }
  if (res.warnings.length) summaryEl.append(h('ul', { class: 'warns' }, res.warnings.map(w => h('li', null, '⚠ ' + w.msg))));
  dlBtn.classList.toggle('ready', res.ok); pdfBtn.classList.toggle('ready', res.ok);
  renderPreview();
  return res;
}
function renderPreview() {
  const m = buildModel(state, true);
  const rows = m.rows.map(r => '<tr><td>' + r.lines.map(l => '<div>' + markHtml(l) + '</div>').join('') + '</td><td class="c">' +
    r.priceLines.map(l => '<div>' + markHtml(l) + '</div>').join('') + '</td></tr>').join('');
  const empty = '<tr><td colspan="2" class="emptyrow">Услуги не выбраны</td></tr>';

    '<p class="note">' + m.note.map(markHtml).join(' ') + '</p>' +
    '<div class="fixed">Дальше подставляются автоматически: лицензия МЧС Л014-00101-78/03255690, QR-коды, «Только аттестованные специалисты выполняют работы по проектированию.», подпись и печать генерального директора.</div>';
}
async function download(kind) {
  showAll = true;
  const res = refresh();
  if (!res.ok) {
    const first = document.querySelector('.err:not(:empty)');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  dlBtn.disabled = pdfBtn.disabled = true;
  try {
    const pdf = kind === 'pdf';
    const blob = pdf ? await buildPdf(state) : await buildDocx(state, JSZip, TEMPLATE_B64, 'blob');
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: pdf ? pdfFileName(state) : docxFileName(state) });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    alert('Не удалось собрать файл: ' + e.message);
  } finally { dlBtn.disabled = pdfBtn.disabled = false; }
}

#apiModal button.ok{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
</style>
<script src="chat.js"></script>
<button id="apiGear" title="Настройки подключения" aria-label="Настройки">⚙</button>
<div id="apiModal"><div class="box">
  <h2>Подключение к таблице</h2>
  <p>Адрес веб-приложения Apps Script и ключ доступа (свойство <b>API_KEY</b> в настройках скрипта). Хранятся только в этом браузере.</p>
  <label for="apiUrl">URL веб-приложения (…/exec)</label><input id="apiUrl" type="url" autocomplete="off">
  <label for="apiKey">Ключ доступа</label><input id="apiKey" type="password" autocomplete="off">
  <label for="brUrl">Мост «Общение» — адрес (https://…)</label><input id="brUrl" type="url" autocomplete="off" placeholder="https://mpb-bridge.example.org">
  <label for="brKey">Мост «Общение» — ключ (BRIDGE_KEY)</label><input id="brKey" type="password" autocomplete="off">
  <div class="btns"><button type="button" id="apiCancel">Отмена</button><button type="button" class="ok" id="apiSave">Сохранить</button></div>
</div></div>
<script>
(function(){
  if (window.google && google.script && google.script.run) { document.getElementById("apiGear").style.display = "none"; return; }
  var m = document.getElementById("apiModal");
  window.openApiSettings = function(){
    var c = apiCfg(); document.getElementById("apiUrl").value = c.url; document.getElementById("apiKey").value = c.key;
    var b = {}; try { b = JSON.parse(localStorage.getItem("mpb_bridge") || "{}"); } catch(e){}
    document.getElementById("brUrl").value = b.url || ""; document.getElementById("brKey").value = b.key || "";
    m.classList.add("on");
  };
  document.getElementById("apiGear").onclick = openApiSettings;
  document.getElementById("apiCancel").onclick = function(){ m.classList.remove("on"); };
  document.getElementById("apiSave").onclick = function(){
    try { localStorage.setItem("mpb_api", JSON.stringify({ url: document.getElementById("apiUrl").value.trim(), key: document.getElementById("apiKey").value.trim() }));
      localStorage.setItem("mpb_bridge", JSON.stringify({ url: document.getElementById("brUrl").value.trim(), key: document.getElementById("brKey").value.trim() })); } catch(e){}
    location.reload();
  };
  if (!apiCfg().key) openApiSettings();
})();
</script>
</body>
</html>
