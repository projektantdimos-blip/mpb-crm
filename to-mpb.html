<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТО МПБ — Контроль технического обслуживания</title>
<style>
:root{
  --blue:#1f5c99;--blue-d:#164a7d;--blue-l:#e8f0f8;--orange:#ee9264;
  --ink:#1d2733;--muted:#66717e;--line:#d6dde5;--bg:#f3f6f9;
  --ok:#1e7b46;--ok-l:#e5f4ec;--bad:#c0392b;--bad-l:#fdeceb;--warn:#a86a00;--warn-l:#fbf1e0;
  --card:#ffffff;
}
html{font-size:15px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{width:100%;padding:14px 18px 30px}
h2.title{margin:0 0 4px;font-size:1.3rem}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],select,input[type=text],input[type=number],input[type=date]{padding:8px 10px;border:1px solid #b9c4d0;border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer}
button.primary:hover{background:var(--blue-d)}
button.ghost{background:var(--card);border:1px solid #b9c4d0;color:var(--ink);border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
button.ghost:hover{border-color:var(--blue)}
button.danger{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}
button.danger:hover{background:var(--bad-l)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:8px 16px;font-size:.82rem;color:var(--muted)}
.chip b{display:block;font-size:1.5rem;color:var(--ink);line-height:1.1}
.chip.bad{border-left-color:var(--bad)}.chip.bad b{color:var(--bad)}
.chip.ok{border-left-color:var(--ok)}.chip.ok b{color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:10px;align-items:center}
.rules{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.rules b{color:var(--ink)}

/* ---- таблицы ---- */
.tblwrap{background:var(--card);border:1px solid #b9c4d0;border-radius:12px;overflow:auto;max-height:calc(100vh - 250px);min-height:200px;box-shadow:0 1px 4px rgba(20,40,70,.08)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid #dfe5ec;border-right:1px solid #e6ebf1;white-space:nowrap;text-align:center;vertical-align:middle;background:var(--card)}
thead th{background:var(--blue-d);color:#fff;position:sticky;top:0;z-index:2;font-weight:600;border-right-color:rgba(255,255,255,.18);border-bottom:0;padding:9px}
thead th small{font-weight:400;opacity:.8}
thead th.cur{background:var(--orange);color:#1d2733}
tbody tr:nth-child(even) td{background:#f5f8fb}
tbody tr:hover td{background:#eaf2fb}
td.l,th.l{text-align:left}
td.n,th.n{position:sticky;left:0;z-index:1;width:40px;min-width:40px;color:var(--muted);font-weight:600}
th.n{z-index:3}
td.name,th.name{position:sticky;left:40px;min-width:230px;max-width:320px;white-space:normal;text-align:left;font-weight:700;border-right:2px solid #b9c4d0}
td.name{z-index:1}th.name{z-index:3}
td.name small{display:block;font-weight:400;color:var(--muted);margin-top:1px}
tbody tr:nth-child(even) td.n,tbody tr:nth-child(even) td.name{background:#f5f8fb}
tbody tr:hover td.n,tbody tr:hover td.name{background:#eaf2fb}
td.cur{box-shadow:inset 0 0 0 2px var(--orange)}

.pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.bad{background:var(--bad);color:#fff}.pill.ok{background:var(--ok);color:#fff}.pill.warn{background:#e0a100;color:#fff}.pill.grey{background:#dde3ea;color:var(--ink)}

/* выпадающие статусы */
select.st{appearance:none;-webkit-appearance:none;width:74px;padding:5px 4px;border-radius:8px;border:1px solid transparent;font:inherit;font-weight:700;text-align:center;text-align-last:center;cursor:pointer}
select.st.yes{background:#2e9d5b;color:#fff}
select.st.no{background:#d64545;color:#fff}
select.st.sent{background:#e0a100;color:#fff}
select.st.empty{background:#fff;color:#7d8896;border:1px dashed #9aa6b4}
select.st.off{background:#eceff3;color:#8a94a1;border:1px solid #d6dde5}
select.st.w{width:96px}
td.offc{background:repeating-linear-gradient(45deg,#f1f3f6,#f1f3f6 6px,#e9ecf0 6px,#e9ecf0 12px)!important}
td.pair{min-width:215px}
td.pair select.st{width:100px;font-size:.8rem}
td input[type=text],td input[type=date],td select:not(.st){width:100%;min-width:110px;padding:5px 7px;font-size:.84rem}
.empty-msg{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---- телефон: строки таблиц превращаются в карточки ---- */
@media(max-width:760px){
  html{font-size:14px}
  .wrap{padding:8px 8px 24px}
  h2.title{font-size:1.1rem}
  .hint{font-size:.8rem}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  .tab{white-space:nowrap;flex:0 0 auto}
  .toolbar{gap:6px}
  .toolbar input[type=search]{flex:1 1 100%}
  .toolbar select{flex:1 1 40%}
  .chips{gap:6px}
  .chip{flex:1 1 44%;padding:6px 10px;font-size:.74rem}
  .chip b{font-size:1.25rem}
  .rules{display:none}
  .tblwrap{overflow:visible;max-height:none;border:0;background:transparent;box-shadow:none;min-height:0}
  table{display:block;font-size:.9rem}
  thead{display:none}
  tbody{display:block;counter-reset:rn}
  tbody tr{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:6px;background:var(--card)!important;border:1px solid #b9c4d0;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(20,40,70,.08);counter-increment:rn}
  table.acc tbody tr{--cols:3}
  td{display:block;border:0;padding:0;text-align:left;white-space:normal;position:static;min-width:0;max-width:none;grid-column:1/-1;width:auto}
  tbody tr td,tbody tr:nth-child(even) td,tbody tr:hover td{background:transparent!important}
  td.n{display:none}
  .legend{display:none}
  #exp,#imp,#csv{flex:1 1 28%;padding:7px 4px;font-size:.8rem}
  td.name{position:static!important;left:auto!important;min-width:0!important;border-right:0!important;font-size:1.02rem;padding-bottom:4px;border-bottom:1px solid #e3e8ee;margin-bottom:2px}
  td.name::before{content:counter(rn) ". ";color:var(--blue);font-weight:700}
  td.name:has(input)::before{content:none}
  td.name small{font-size:.8rem}
  td[data-l]:not(.mc):not(.name)::before{content:attr(data-l);display:block;font-size:.7rem;color:var(--muted);margin-bottom:1px}
  td.meta{grid-column:span 2}
  td.mc{grid-column:span 1;text-align:center}
  td.mc::before{content:attr(data-l);display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
  td.mc.mc1{grid-column-start:1}
  td.mc.cur::before{color:var(--orange)}
  td.cur{box-shadow:none}
  td.mc.cur select.st,td.mc.cur.offc{outline:2px solid var(--orange);outline-offset:1px;border-radius:8px}
  td.offc{background:#eef0f3!important;border-radius:8px;padding:4px 0!important;text-align:center}
  td.mc.pair{min-width:0!important;display:flex;flex-direction:column;gap:3px}
  td.mc.pair::before{margin-bottom:0}
  select.st,select.st.w,td.pair select.st{width:100%;min-width:0;padding:7px 2px;font-size:.82rem}
  td input[type=text],td input[type=date],td input[type=number],td select:not(.st),td input.pin{width:100%!important;min-width:0!important;font-size:1rem;padding:8px}
  td button{width:100%;margin-top:4px}
  td .pin{width:60%!important;display:inline-block}
  td .pin+button{width:36%;display:inline-block}
}</style>
</head>

  </div>
</div>
<div class="toast" id="toast"></div>

  MONTHS.forEach(function(m,i){h+='<th'+(isCurYear()&&i+1===curM?' class="cur"':'')+'>'+m+'<br><small>акт / оплата</small></th>'});
  h+='<th class="l">Примечание</th></tr></thead><tbody>';
  list.forEach(function(o,i){
    var y=Y(o);
    h+='<tr data-id="'+o.id+'"><td class="n">'+(i+1)+'</td><td class="name">'+esc(o.name)+'</td><td>'+esc(o.contract)+(o.signed?'<br><small>'+esc(o.signed)+'</small>':'')+'</td><td>'+esc(o.period)+'</td><td>'+money(o.cost)+'</td>';
    for(var m=1;m<=12;m++){
      if(!planned(o,m)&&!y.act[m]&&!y.pay[m]){h+='<td class="offc" title="'+MFULL[m-1]+' — ТО не требуется" style="color:#9aa6b4">—</td>';continue}
      h+='<td class="pair">'+stSel('data-k="act" data-m="'+m+'"',ACT_OPTS,y.act[m]||"",ACT_CLS)+' '+stSel('data-k="pay" data-m="'+m+'"',PAY_OPTS,y.pay[m]||"",PAY_CLS)+'</td>';
    }
    h+='<td><input type="text" data-f="note" value="'+esc(y.note)+'" style="min-width:200px"></td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ====== Объекты ====== */
function renderObj(){
  var list=filtered();
  var yn=function(k,o){return '<select data-o="'+k+'"><option></option>'+["Да","Нет"].map(function(p){return '<option'+(o[k]===p?" selected":"")+'>'+p+'</option>'}).join("")+'</select>'};
  var tx=function(k,o,w){return '<td><input type="text" data-o="'+k+'" value="'+esc(o[k])+'" style="min-width:'+(w||110)+'px"></td>'};
  var specOpts=function(o){return '<select data-o="spec"><option value=""></option>'+data.specialists.map(function(s){return '<option'+(o.spec===s.name?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select>'};
  var h='<div class="toolbar"><button class="primary" id="add">+ Добавить объект</button></div><p class="hint">Данные об объекте вводятся здесь один раз — «Контроль ТО» и «Бухгалтерия» берут их отсюда. Плановые месяцы считаются из «Периодичности» и «Первого месяца».</p>';
  h+='<div class="tblwrap"><table><thead><tr><th class="n">№</th><th class="name">Заказчик</th><th>Адрес</th><th>Вид ТО</th><th>Договор</th><th>Подписан?</th><th>Периодичность</th><th>Первый месяц</th><th>Стоимость, ₽</th><th>Специалист</th><th>Контакт заказчика</th><th>Шифр проекта</th><th>ППКП</th><th>Акт вх. контроля</th><th>Журнал</th><th>Инструкция и схема</th><th>Примечание</th><th></th></tr></thead><tbody>';
  list.forEach(function(o,i){
    h+='<tr data-id="'+o.id+'"><td class="n">'+(i+1)+'</td><td class="name"><input type="text" data-o="name" value="'+esc(o.name)+'"></td>'
     +tx("address",o,220)
     +'<td><select data-o="kind">'+["СПС.СОУЭ","Огнетушители"].map(function(p){return '<option'+(o.kind===p?" selected":"")+'>'+p+'</option>'}).join("")+'</select></td>'
     +tx("contract",o,150)
     +'<td><select data-o="signed"><option></option><option'+(o.signed==="Подписан"?" selected":"")+'>Подписан</option><option'+(o.signed==="Не подписан"?" selected":"")+'>Не подписан</option></select></td>'
     +'<td><select data-o="period">'+["Месяц","Квартал","Полугодие","Год"].map(function(p){return '<option'+(o.period===p?" selected":"")+'>'+p+'</option>'}).join("")+'</select></td>'
     +'<td><select data-o="first">'+MFULL.map(function(p,j){return '<option value="'+(j+1)+'"'+(o.first===j+1?" selected":"")+'>'+p+'</option>'}).join("")+'</select></td>'
     +'<td><input type="number" data-o="cost" value="'+(o.cost||"")+'" style="width:100px"></td>'
     +'<td>'+specOpts(o)+'</td>'+tx("client",o,180)+tx("code",o,160)+tx("ppkp",o,90)
     +'<td>'+yn("entry",o)+'</td><td>'+yn("journal",o)+'</td><td>'+yn("instr",o)+'</td>'+tx("note",o,200)
     +'<td><button class="danger" data-del="1">Удалить</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ====== Специалисты ====== */
function renderSpec(){
  var pinCell=function(key,has){return '<td style="min-width:230px"><span class="pill '+(has?"ok":"grey")+'">'+(has?"PIN задан":"нет PIN")+'</span> <input type="text" inputmode="numeric" maxlength="8" placeholder="новый PIN" class="pin" data-pk="'+esc(key)+'" style="width:100px;min-width:0"> <button class="ghost" data-setpin="1">Задать</button></td>'};
  var h='<div class="toolbar"><button class="primary" id="addspec">+ Добавить специалиста</button></div><p class="hint">Справочник специалистов. У каждого — свой PIN (4–8 цифр): по нему специалист входит и видит только свои объекты. Пустое поле + «Задать» удаляет PIN. При удалении специалиста его объекты остаются «без специалиста».</p>';
  h+='<div class="tblwrap" style="min-height:0;margin-bottom:14px"><table><thead><tr><th class="l">Бухгалтер</th><th>PIN</th></tr></thead><tbody><tr><td class="l"><b>Вход бухгалтера</b> — видит только вкладку «Бухгалтерия»</td>'+pinCell("__acc",accPin)+'</tr></tbody></table></div>';
  h+='<div class="tblwrap"><table><thead><tr><th class="n">№</th><th class="l">Специалист</th><th class="l">Телефон</th><th>Объектов</th><th>Не закрыто ТО, шт.</th><th>PIN</th><th></th></tr></thead><tbody>';
  data.specialists.forEach(function(s,i){
    var os=data.objects.filter(function(o){return o.spec===s.name}),un=0;
    os.forEach(function(o){un+=unclosed(o)});
    h+='<tr data-si="'+i+'"><td class="n">'+(i+1)+'</td><td><input type="text" data-s="name" value="'+esc(s.name)+'"></td><td><input type="text" data-s="phone" value="'+esc(s.phone)+'"></td><td>'+os.length+'</td><td>'+(un?'<span class="pill bad">'+un+'</span>':'<span class="pill ok">0</span>')+'</td>'+pinCell(s.name,pins[s.name])+'<td><button class="danger" data-delspec="1">Удалить</button></td></tr>';
  });
  if(!data.specialists.length)h+='<tr><td colspan="7" class="empty-msg">Нет специалистов</td></tr>';
  return h+'</tbody></table></div>';
}

function render(){
  fillYears();
  $("view").innerHTML=view==="control"?renderControl():view==="acc"?renderAcc():view==="obj"?renderObj():renderSpec();
  labelize();
}
/* подписи ячеек для карточек на телефоне */
function labelize(){
  [].forEach.call(document.querySelectorAll("#view table"),function(t){
    t.classList.toggle("acc",view==="acc");
    var hs=[].map.call(t.querySelectorAll("thead th"),function(h){return h.childNodes[0]?h.childNodes[0].textContent.trim():""});
    [].forEach.call(t.querySelectorAll("tbody tr"),function(tr){
      [].forEach.call(tr.children,function(td,i){
        var l=hs[i]||"";if(l)td.setAttribute("data-l",l);
        if(MONTHS.indexOf(l)>=0){td.classList.add("mc");if(l===MONTHS[0])td.classList.add("mc1")}
        else if(!td.classList.contains("name")&&!td.classList.contains("n")&&!td.querySelector("input,select,button"))td.classList.add("meta");
      });
    });
  });
}

/* ====== Загрузка данных и роли ====== */
function applyRole(){
  var allowed=TABS_BY_ROLE[me.role]||[];
  [].forEach.call($("tabs").children,function(b){b.style.display=allowed.indexOf(b.dataset.v)>=0?"":"none"});
  if(allowed.indexOf(view)<0)view=allowed[0];
  [].forEach.call($("tabs").children,function(b){b.classList.toggle("active",b.dataset.v===view)});
  var adm=me.role==="admin";
  $("specf").style.display=adm?"":"none";
  $("exp").style.display=$("imp").style.display=$("csv").style.display=adm?"":"none";
  $("me").textContent=me.name+(adm?" (руководитель)":me.role==="acc"?" (бухгалтерия)":"");
}
function typingNow(){var a=document.activeElement;return a&&$("view").contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT")}
function loadData(silent){
  return api("to_load",getPin()).then(function(r){
    if(r.empty&&r.role==="admin"){
      return api("to_import",getPin(),SEED).then(function(){return loadData(silent)});
    }
    me={role:r.role,name:r.name};pins=r.pins||{};accPin=!!r.accPin;
    data=migrate({objects:r.objects,specialists:r.specialists,nextId:r.nextId});
    $("login").style.display="none";
    applyRole();fillSpecs();render();setSync("Сохранено ✓");
  });
}
function showLogin(msg){
  me=null;$("login").style.display="flex";$("loginErr").textContent=msg||"";$("pinIn").value="";$("pinIn").focus();
}
function doLogin(){
  var p=$("pinIn").value.trim();if(!p)return;
  var b=$("pinBtn");b.disabled=true;
  setPin(p);
  loadData().catch(function(e){setPin("");showLogin(e.message)}).then(function(){b.disabled=false});
}
$("pinBtn").onclick=doLogin;
$("pinIn").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("logout").onclick=function(){setPin("");pending=[];data={objects:[],specialists:[],nextId:1};$("view").innerHTML="";showLogin()};
setInterval(function(){ // подтягиваем изменения других пользователей
  if(me&&!pending.length&&!busy&&!typingNow())loadData(true).catch(function(){});
},60000);

/* ====== События (без перерисовки таблицы при выборе статусов) ====== */
function find(el){var tr=el.closest("tr");return tr&&data.objects.filter(function(o){return o.id==tr.dataset.id})[0]}
function uniqSpecName(){var n=1,nm;do{nm="Новый специалист"+(n>1?" "+n:"");n++}while(data.specialists.some(function(s){return s.name===nm}));return nm}
$("view").addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="add"){
    var no={id:Date.now(),name:"Новый заказчик",address:"",kind:"СПС.СОУЭ",spec:"",client:"",code:"",ppkp:"",entry:"",journal:"",instr:"",note:"",contract:"",signed:"",period:"Месяц",first:1,cost:0,years:{}};
    data.objects.push(no);op({k:"objAdd",obj:no});render();return}
  if(t.id==="addspec"){var s0={name:uniqSpecName(),phone:""};data.specialists.push(s0);op({k:"specAdd",name:s0.name,phone:""});fillSpecs();render();return}
  if(t.dataset.setpin){
    var inp=t.parentNode.querySelector(".pin"),key=inp.dataset.pk,v=inp.value.trim();
    if(v&&!/^\d{4,8}$/.test(v)){toast("PIN — 4–8 цифр");return}
    api("to_setPin",getPin(),key,v).then(function(){if(key==="__acc")accPin=!!v;else pins[key]=!!v;toast(v?"PIN сохранён":"PIN удалён");render()}).catch(function(er){toast(er.message)});
    return;
  }
  if(t.dataset.delspec){
    var tr=t.closest("tr"),idx=+tr.dataset.si,s=data.specialists[idx];
    if(confirm("Удалить специалиста «"+s.name+"»? Его объекты останутся без специалиста, его PIN будет удалён.")){
      data.objects.forEach(function(o){if(o.spec===s.name)o.spec=""});
      data.specialists.splice(idx,1);delete pins[s.name];op({k:"specDel",name:s.name});fillSpecs();render();
    }return;
  }
  var o=find(t);if(!o)return;
  if(t.dataset.del&&confirm("Удалить объект «"+o.name+"» со всеми данными?")){data.objects=data.objects.filter(function(x){return x!==o});op({k:"objDel",id:o.id});render()}
});
$("view").addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.s!==undefined){
    var s=data.specialists[+t.closest("tr").dataset.si];
    if(t.dataset.s==="name"){
      var old=s.name,nv=t.value.trim();
      if(!nv||data.specialists.some(function(x){return x!==s&&x.name===nv})){t.value=old;toast("Имя пустое или уже есть");return}
      s.name=nv;data.objects.forEach(function(o){if(o.spec===old)o.spec=nv});
      if(pins[old]){pins[nv]=pins[old];delete pins[old]}
      op({k:"specSet",name:old,f:"name",v:nv});fillSpecs();
    }else{s.phone=t.value;op({k:"specSet",name:s.name,f:"phone",v:t.value})}
    return;
  }
  var o=find(t);if(!o)return;
  if(t.dataset.m&&!t.dataset.k){ // статус ТО
    Y(o).to[t.dataset.m]=t.value;op({k:"cell",id:o.id,year:year,field:"to",m:+t.dataset.m,v:t.value});
    t.className="st "+stCls(TO_CLS,t.value);
    var tr=t.closest("tr"),lv=rowLive(o);
    tr.querySelector(".lv-st").innerHTML=lv.st;tr.querySelector(".lv-un").innerHTML=lv.un;
    t.closest("td").classList.remove("offc");
    $("chips").innerHTML=controlChips(filtered());
    return;
  }
  if(t.dataset.k){ // акт / оплата
    Y(o)[t.dataset.k][t.dataset.m]=t.value;op({k:"cell",id:o.id,year:year,field:t.dataset.k,m:+t.dataset.m,v:t.value});
    t.className="st "+stCls(t.dataset.k==="act"?ACT_CLS:PAY_CLS,t.value);
    $("chips").innerHTML=accChips(filtered());
    return;
  }
  if(t.dataset.f){Y(o)[t.dataset.f]=t.value;op({k:"yf",id:o.id,year:year,f:t.dataset.f,v:t.value});return}
  if(t.dataset.o){
    var v=t.value,k=t.dataset.o;
    o[k]=(k==="cost"||k==="first")?Number(v)||0:v;op({k:"obj",id:o.id,f:k,v:o[k]});
    if(k==="period"||k==="first")render();
  }
});
$("tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;
  view=b.dataset.v;[].forEach.call(this.children,function(c){c.classList.toggle("active",c===b)});render();
});
$("q").addEventListener("input",render);
$("specf").addEventListener("change",render);
$("year").addEventListener("change",function(){
  if(this.value==="+"){var n=parseInt(prompt("Год:",year+1),10);if(n>2000&&n<2100)year=n}else year=parseInt(this.value,10);
  render();
});
function download(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}
$("exp").onclick=function(){download("to-mpb.json",JSON.stringify(data,null,1),"application/json")};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d.objects)throw 0;
      if(!confirm("Заменить ВСЕ данные ТО на сервере данными из файла?"))return;
      api("to_import",getPin(),d).then(function(){return loadData()}).then(function(){toast("Импортировано")}).catch(function(er){toast(er.message)});
    }catch(e){toast("Неверный файл")}};
  r.readAsText(f,"utf-8");this.value="";
};
$("csv").onclick=function(){
  var rows=[["№","Заказчик","Адрес","Специалист"].concat(MFULL).concat(["Провести до","Причина"])];
  var L={"yes":"Да","no":"Нет","":""};
  filtered().forEach(function(o,i){var y=Y(o);rows.push([i+1,o.name,o.address,o.spec].concat(MONTHS.map(function(_,j){return L[y.to[j+1]||""]})).concat([y.deadline,y.reason]))});
  var t=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(";")}).join("\r\n");
  download("to-mpb-"+year+".csv","﻿"+t,"text/csv");
};

/* старт */
fillYears();
if(getPin()){loadData().catch(function(e){setPin("");showLogin(e.message)})}else showLogin();
})();
</script>
</body>
</html>
